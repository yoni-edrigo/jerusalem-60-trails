<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="60 סיורים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light only">
<title>60 סיורים בירושלים</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* iOS system palette — light only */
:root{color-scheme:light only;
  --bg:#f2f2f7; --cell:#ffffff; --fill:rgba(118,118,128,.12); --sep:rgba(60,60,67,.29);
  --label:#000; --label2:rgba(60,60,67,.6); --tint:#007aff; --material:rgba(249,249,249,.82);
  --sheet-shadow:0 -1px 0 rgba(0,0,0,.08),0 -8px 30px rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--label);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#map{position:fixed;inset:0}
.glass{background:var(--material);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}

/* ---------- sheet: bottom sheet on phones, floating card on desktop ---------- */
#sheet{position:fixed;z-index:1000;display:flex;flex-direction:column;box-shadow:var(--sheet-shadow)}
.grabber{flex:none;height:30px;display:grid;place-items:center;cursor:grab;touch-action:none;margin-bottom:-8px}
.grabber::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--sep)}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  padding:0 16px calc(24px + env(safe-area-inset-bottom));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.drag-zone{touch-action:none}
.closebtn{position:absolute;top:10px;left:12px;z-index:3;width:30px;height:30px;border-radius:50%;border:0;
  background:var(--fill);color:var(--label2);font-size:15px;font-weight:700;cursor:pointer;display:none}
@media (max-width:760px){
  #sheet{left:0;right:0;bottom:0;border-radius:12px 12px 0 0;
    height:calc(100vh - env(safe-area-inset-top) - 10px);height:calc(100dvh - env(safe-area-inset-top) - 10px);
    transform:translateY(var(--y,50%));transition:transform .45s cubic-bezier(.32,.72,0,1)}
  #sheet.dragging{transition:none}
  body.sheet-closed #sheet{box-shadow:none}
  .closebtn{display:block}
}
@media (min-width:761px){
  #sheet{top:16px;bottom:16px;right:16px;width:380px;border-radius:14px}
  .grabber{display:none}
}

/* FAB (phones, when the sheet is closed) */
#fab{position:fixed;z-index:1001;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,140%);transition:transform .4s cubic-bezier(.32,.72,0,1);
  border:0;border-radius:28px;height:56px;padding:0 22px;display:none;align-items:center;gap:8px;
  color:var(--tint);font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#fab svg{width:22px;height:22px}
@media (max-width:760px){#fab{display:flex} body.sheet-closed #fab{transform:translate(-50%,0)}}

/* full-screen button + iOS tip */
#fs{position:fixed;z-index:999;top:calc(12px + env(safe-area-inset-top));left:12px;height:40px;min-width:40px;padding:0 10px;
  border:0;border-radius:10px;display:none;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--label);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#fs svg{width:20px;height:20px}
#fs.on{color:#fff;background:#ff3b30}
@media (min-width:761px){#fs{top:auto;bottom:30px}}
#tip{position:fixed;z-index:1002;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;border-radius:14px;
  padding:12px 44px 12px 14px;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.2);display:none}
#tip button{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--fill);cursor:pointer}

/* ---------- typography ---------- */
.large-title{font-size:30px;font-weight:700;letter-spacing:.01em;margin:4px 0 2px}
.subtitle{color:var(--label2);font-size:15px;margin:0 0 12px}
.section{font-size:13px;color:var(--label2);text-transform:uppercase;margin:22px 16px 6px}
.footnote{font-size:13px;color:var(--label2)}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px}
.search svg{flex:none;opacity:.6}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;color:var(--label);min-width:0}
.search input::placeholder{color:var(--label2)}
.pills{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none;touch-action:pan-x}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:0;border-radius:999px;padding:6px 12px;font-size:15px;background:var(--fill);cursor:pointer;white-space:nowrap}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
.pill[aria-pressed=true]{background:var(--tint);color:#fff}
.group{background:var(--cell);border-radius:10px;overflow:hidden;margin:0;padding:0;list-style:none}
.group li{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:60px;cursor:pointer;position:relative}
.group li+li::before{content:"";position:absolute;top:0;left:0;right:56px;border-top:.5px solid var(--sep)}
.group li:active{background:var(--fill)}
.badge{flex:none;width:30px;height:30px;border-radius:8px;color:#fff;font:600 13px/30px -apple-system,system-ui,sans-serif;text-align:center}
.cell-text{flex:1;min-width:0;padding:9px 0}
.cell-text b{display:block;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-text small{display:block;font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;color:var(--sep);font-size:20px;transform:scaleX(-1)}
.navbar{display:flex;align-items:center;height:44px;margin:0 -8px}
.navbtn{border:0;background:none;color:var(--tint);font-size:17px;cursor:pointer;padding:8px;display:flex;align-items:center;gap:2px}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:6px;padding:2px 8px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cell);border-radius:10px;margin-top:14px}
.stats div{padding:10px 8px;text-align:center}
.stats div+div{border-right:.5px solid var(--sep)}
.stats small{display:block;font-size:11px;color:var(--label2);text-transform:uppercase}
.stats b{font-size:17px;font-weight:600}
.story{background:var(--cell);border-radius:10px;padding:14px 16px;font-size:17px;line-height:1.5;margin-top:14px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.actions a{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--cell);border-radius:10px;
  padding:10px 4px;color:var(--tint);text-decoration:none;font-size:13px;font-weight:500}
.actions a[aria-disabled=true]{opacity:.35;pointer-events:none}
.actions svg{width:24px;height:24px}
.stoplist li{min-height:44px;cursor:default}
.stoplist .badge{width:24px;height:24px;border-radius:50%;line-height:22px;font-size:12px;background:#fff!important;color:#000;border:2px solid}
.prose{background:var(--cell);border-radius:10px;padding:12px 16px;font-size:15px;line-height:1.55;color:var(--label)}

/* map pins: trails = filled rounded squares, stations = white circles with trail-colour ring */
.pin{width:30px;height:30px;border-radius:9px;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
  display:grid;place-items:center;color:#fff;font:600 12px -apple-system,system-ui,sans-serif;
  transition:transform .25s,opacity .25s,filter .25s}
.pin.approx{border-style:dashed}
.has-selection .pin:not(.on){opacity:.55;filter:grayscale(.5);transform:scale(.85)}
.pin.on{transform:scale(1.3)}
.stopdot{background:#fff;color:#000;border:3px solid currentColor;border-radius:50%;width:24px;height:24px;
  font:700 11px -apple-system,system-ui,sans-serif;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.stopdot span{color:#000}
.leaflet-container{background:var(--bg);font:inherit}
.leaflet-control-zoom{border:0!important;border-radius:10px!important;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15)!important}
.leaflet-control-zoom a{background:var(--material)!important;color:var(--label)!important}
@media (max-width:760px){.leaflet-control-zoom{display:none}}
.leaflet-control-layers{border:0!important;border-radius:10px!important;box-shadow:0 2px 10px rgba(0,0,0,.18)!important;
  background:var(--material)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:15px}
.leaflet-control-layers-toggle{width:40px!important;height:40px!important;background-size:22px!important}
.leaflet-control-layers-expanded{padding:8px 12px!important}
.leaflet-control-layers label{padding:4px 0}
@media (max-width:760px){.leaflet-top.leaflet-left{top:calc(56px + env(safe-area-inset-top))}}

</style>
</head>
<body>
<div id="map"></div>
<button id="fs" class="glass" aria-label="מסך מלא"></button>
<div id="tip" class="glass" role="status"><button aria-label="סגירה">✕</button>למסך מלא באייפון: לחצו על <b>שיתוף</b> ⬆︎ ואז <b>הוספה למסך הבית</b></div>
<section id="sheet" class="glass" aria-label="סיורים">

  <button class="closebtn" id="closeSheet" aria-label="סגירת החלונית">✕</button>
  <div class="scroll" id="scroll"></div>

: 3, "name": "יובל שנים לאיחוד ירושלים - בעקבות טדי קולק", "topic": "יובל שנים לאיחוד ירושלים", "title": "בעקבות טדי קולק", "story": "\"טדי הוא ירושלים וירושלים היא טדי\". בעקבות טדי קולק, ראש העיר שעיצב את ירושלים החדשה – מבניין העירייה ההיסטורי, דרך פארק טדי ומשכנות שאננים ועד מוזיאון ישראל שהקים.", "desc": "סלול הסיור מתחיל בבניין העירייה ההיסטורי (1), ברחוב יפו 2. ניכנס דרך המבואה אל קריית העירייה (2) שב\"כיכר ספרא\", נחזור אל \"כיכר צה\"ל\", נלך ברחוב שלמה המלך לכיוון דרום-מערב (שמאלה) עד \"כיכר המכס\", נפנה בה מזרחה (שמאלה) אל רחוב יצחק קריב, ודרכו נגיע אל פארק טדי – גן הורדוס (3). נצא ממערב הפארק אל רחוב רזיאל, נלך בו דרומה עד רחוב ש\"א נכון ובו עד רחוב ימין משה, נפנה בימין משה מערבה (ימינה) ונעלה במדרגות למבנה טחנת הקמח ולנקודת תצפית מגג משכנות שאננים (4). נמשיך מערבה דרך שדרות בלומפילד אל רחוב קרן היסוד, נתקדם ברחוב קרן היסוד לכיוון צפון-מערב, נחצה את \"כיכר צרפת\" ונחבור אל רחוב המלך ג'ורג'. נגיע אל בניין המוסדות הלאומיים והסוכנות היהודית (5) ברחוב המלך ג'ורג'48 פינת רחוב הקק\"ל. מכאן נפנה ברחוב קק\"ל מערבה (שמאלה) עד רחוב אבן גבירול, נלך בו דרומה (ימינה) עד רחוב רמב\"ן, נפנה מערבה (ימינה) ברחוב רמב\"ן ודרומה (שמאלה) ברחוב רשב\"א ונגיע אל בית טדי קולק (6) ברחוב רשב\"א 5. נחזור על עקבותינו אל רחוב רמב\"ן, נלך בו מערבה (שמאלה) עד רחוב דיסקין וברחוב דיסקין נלך צפונה לבית מספר 9, לנקודת התצפית וולפסון (7) שבגג המרפסת המערבית של המרכז הרפואי. נרד במדרגות אל שדרות בן צבי, נחצה את הרחוב לכיוון מערב אל דרך רופין, נעלה בעלייה המתפתלת אל רחוב סטפן וייז ונלך בו אל הכניסה למוזאון ישראל (8).", "start": "בניין עיריית ירושלים ההיסטורי, כיכר צה\"ל, רחוב יפו 2", "length": "5.5 ק\"מ", "difficulty": "קל", "accessible": "כן", "catalog": "https://tiulim.education.gov.il/trips-katalog/tedi-kolek/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/kolek.pdf", "gmap": "", "lat": 31.779, "lng": 35.226, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 4, "name": "ירושלים - בירת הנצח", "topic": "מסלולי עיר ונוף", "title": "ירושלים - בירת הנצח", "story": "\"אם לארץ נשמה – הרי ירושלים נשמתה של ארץ ישראל\" (בן גוריון). מסע מעיר דוד, דרך הרובע היהודי ועד משכן הכנסת – מהבירה של דוד המלך לבירת מדינת ישראל.", "desc": "תחילת המסלול בכניסה לאתר עיר דוד. משם נעלה צפונה לתצפית מרהיבה מגג בית הצופה. לאחר מכן נרד דרומה, נעבור דרך אתר שיש משערים שהוא ארמון המלך דוד, נמשיך מזרחה לעבר מרגלות החומה היבוסית אל קריית השלטון שבשטח ג'י, משם נמשיך לכיוון דרום ונרד לעבר הכניסה לפיר וורן. בכניסה לפיר כמה דברים מעניינים: הפיר עצמו, הדלי שתחוב בקיר, הברכה שבבית המעיין והתרשים המשוער של בית המעיין. נמשיך עד לכניסה לנקבת השילוח, שתוביל אותנו אל היציאה בברכת השילוח. משם נעלה צפונה לעבר חניון גבעתי דרך תעלת הניקוז הקדומה של רחוב הגיא. נחצה את הכביש לעבר שער האשפות ונלך אל הרובע היהודי. נבקר בכמה אתרים ברובע: הכותל המערבי (א), דגם מנורת המקדש (ב), רחבת הרובע ובית הכנסת החורבה (ג), בתי הכנסת הספרדיים (ד), גלעד לקבר האחים (ה), כיכר בתי המחסה (ו). מנקודה זו נמשיך לעבר שער ציון, וממנו נצא אל ירושלים שמחוץ לחומה. בשער נפנה מערבה ונלך עד לרחבת התצפית של גן בוני ירושלים. נצפה ממנה אל ימין משה ואל משכנות שאננים. משם נמשיך בנסיעה אל בניין הכנסת ואל מנורת הכנסת.", "start": "גן לאומי עיר דוד", "length": "5 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/jerusalem-birat-hanetzach/", "pdf": "https://meyda.education.gov.il/files/noar/cityofdavid_knesset_2016.pdf", "gmap": "", "lat": 31.7742, "lng": 35.2357, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 5, "name": "מקרית יובל לעין כרם", "topic": "מסלולי עיר ונוף", "title": "מקרית יובל לעין כרם", "story": "מסלול נוף ושכונות: מהמרכז המסחרי בקריית היובל, דרך ואדי האסבסטונים – שיכוני העולים של שנות ה-50 – ובמורד אל הכפר הציורי עין כרם.", "desc": "נצא מהמרכז המסחרי בקריית היובל, ונחצה את הכביש אל רחוב חיים סירני. נרד במדרגות החוצות את הרחובות פלורנטין וקורצ'ק. נרד עד לנקודה שבה הרחוב מתפצל לרחוב קורצ'ק ורחוב ריגנבלום. נמשיך במדרגות אל העמק, הלא הוא ואדי האסבסטונים. לאחר הליכה בעמק, נחצה את הכביש ונגיע לתא-אטרון. ממנו נתחיל לעלות מהוואדי. נפנה ימ , שבהמשכו נקרא רחוב קינג ג'ורג', עד שנגיע לבניין המוסדות הלאומיים (10). נפנה שמאלה ברחוב קק\"ל ומיד שוב שמאלה לרחוב אבן גבירול ונגיע לצריף הנשיא בן צבי (11).\n ---\nבעקבות קרבות שהתנהלו באזור ירושלים בתש\"ח\n , בין הנופלים להגנת המולדת היו \nחללי נצר אחרון\n. שהינם חללי צה\"ל ניצולי שואה שעלו ארצה בגפם לאחר שנותרו שריד אחרון ממשפחתם שנספתה בשואה, ונפלו בקרבות על שחרור המולדת. סיפורם של : \nמרדכי גוטמן\n | \nשמואל הירש\n | \nנתנאל זויער", "start": "נקודת התחלה: ארמון הנציב נקודת סיום: יד בן צבי", "length": "10 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/armon-hanatziv/", "pdf": "", "gmap": "", "lat": 31.756, "lng": 35.23, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 12, "name": "יובל שנים לאיחוד ירושלים - בעקבות מוטה גור", "topic": "יובל שנים לאיחוד ירושלים", "title": "בעקבות מוטה גור", "story": "\"אנחנו יושבים על הרכס שצופה לעיר העתיקה...\" בעקבות מוטה גור והצנחנים במלחמת ששת הימים – מגבעת התחמושת, דרך שער האריות ועד הכותל: \"הר הבית בידינו\".", "desc": "מסלול הסיור מתחיל בגבעת התחמושת (1), ברחוב זלמן שרגאי 5. משם נפנה לכביש 60, דרך בר-לב, שם עבר קו הגבול הנקרא \"הקו העירוני\". נלך לאורכו לכיוון דרום-מערב ונפנה לכיוון צפון-מזרח (שמאלה) ברחוב נעמי קייס. נמשיך בו עד לכיכר ונפנה בה דרומה (ימינה) אל דרך שכם. נלך בדרך שכם עד לנקודה המכונה \"סמטת המוות\" (2), ברחוב דרך שכם 21. נמשיך בדרך שכם עד רחוב סולטן סולימן, ובו נלך מזרחה עד מוזאון רוקפלר (3) ברחוב סולטן סולימן 27. נצא מרחבת המוזאון לרחוב סולטן סולימן ונלך בו מזרחה עד דרך יריחו, נלך בו לכיוון דרום (ימינה) עד גשר הסיירת – אנדרטה לזכר הצנחנים (4). מעט אחרי האנדרטה נפנה מערבה (ימינה) ונלך כ-300 מטרים עד לשער האריות (5) ברחוב דרך שער האריות. נחזור על עקבותינו ונפנה דרומה (ימינה) אל דרך יריחו וממנה מערבה (ימינה) אל דרך העופל. נלך בטיילת העופל, ששמה משתנה לדרך השלום, וניכנס בשער האשפות אל רחבת הכותל (6). כאן מסתיים המסלול.", "start": "נקודת התחלה: גבעת התחמושת, רחוב זלמן שרגאי 5. נקודת סיום: הכותל המערבי.", "length": "4.5 ק\"מ", "difficult (1) – שדרכו נכנסו לוחמי הפלמ\"ח לרובע הנצור להחיש לו תגבורת ב\"ליל הפורצים\", הלילה שבין ה-18 ל-19 במאי, ושדרכו עזבו התושבים את הרובע בתום הקרבות. משער ציון נתקדם צפונה ברחוב חב\"ד, נרד במדרגות שמעל הקרדו אל עבר רחבת משה רוסנק (לוח זיכרון מאבן) (2) ונפנה שם שמאלה לרחוב היהודים. לאחר הליכה של כמאה מטרים, נגיע אל אתר הזיכרון לחללי הרובע (3). שם נצפה בסרט המספר את סיפורו של הרובע בתש\"ח (אורך הסרט: 12 דק'). מאתר הזיכרון נמשיך מעט צפונה עד למפגש רחוב היהודים ורחוב פלוגת הכותל. שם ניצבה עמדת לובינסקי (4), אחת מעמדות הלחימה ברובע. מכאן נשוב לכיוון דרום-מזרח דרך הכיכר המרכזית של הרובע, כיכר החורבה (5), אל אתר הגלעד – קבר אחים ללוחמי הרובע (6). במרחק קצר מהגלעד נמצאת כיכר בתי מחסה (7), שם נחתם הסכם הכניעה. בכיכר בתי מחסה מסתיים סיורנו. לצורך הרחבה על המאבק המתואר, צפו במסלול נוסף ברמת רחל.", "start": "נקודת התחלה: שער ציון נקודת סיום: שער ציון", "length": "2 ק\"מ", "difficulty": "קל", "accessible": "נגיש ברובו", "catalog": "https://tiulim.education.gov.il/trips-katalog/san-simon/", "pdf": "", "gmap": "", "lat": 31.7714, "lng": 35.2296, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 14, "name": "בוני ירושלים - חזקיהו", "topic": "בוני ירושלים", "title": "חזקיהו", "story": "מים לירושלים בעקבות חזקיהו מלך יהודה, שחצב את נקבת השילוח לקראת המצור האשורי: מאמות המים בארמון הנציב, דרך ברכת הסולטן והחומה הרחבה ברובע היהודי ועד עיר דוד.", "desc": "המסלול מתחיל בגן פסיפס אמת המים בארמון הנציב (1). משם נרד בשביל לכיוון דרום-מזרח, אל הצומת שליד המרכז המסחרי של השכונה (צומת הרחובות עולי הגרדום ודב גרונר), ונחצה את הכביש דרומה אל המדרגות היורדות אל הכניסה למנהרת אמת המים בארמון הנציב (2). ניכנס במנהרה, נלך בה לאור פנסים ולאחר 400 מטר נצא ממנה. נעלה במדרגות אל נקודת תצפית בטיילת ארמון הנציב (3), וממנה נתקדם לכיוון צפון-מערב על טיילת שרובר, לאורך תוואי אמת המים, עד שנגיע לרחוב נעמי בשכונת אבו תור. נפנה צפונה לרחוב צרויה, ובפנייה הראשונה מזרחה נפנה לרחוב גיחון וממנו צפונה לרחוב עשהאל (4). נמשיך ברחוב עשהאל ונרד במדרגות אל רחוב עין רוגל. נלך ברחוב עין רוגל מערבה אל רחוב דרך חברון, נפנה צפונה לרחוב דרך חברון ונרד בו עד סמוך למלון \"הר ציון\", אל מוזאון הרכבל (5). נמשיך בדרך חברון צפונה ועם העיקול מזרחה עד הסביל שעל גשר ברכת הסולטן (6). נחצה את הצומת המרומזר לכיוון דרום-מזרח, אל \"שביל המטיילים\" המקביל לכביש \"מעלה השלום\" שיוביל אותנו אל חפירות חומת מורדות הר ציון (7). משרידי החומה נעלה צפונה ברחוב מעלה השלום אל שער ציון, ניכנס בשער אל הרובע היהודי ונלך ברחוב חב\"ד עד הקרדו. נרד במדרגות מזרחה ונמשיך צפונה ברחוב היהודים. בפנייה השנייה מזרחה (ימינה), נפנה אל החומה הרחבה (8). משם נלך דרך הסמטות בכיוון דרום אל רחוב גלעד, נתקדם בו דרומה עד לגלעד לחללי הרובע, שם נפנה מזרחה ונגיע אל רחבת כיכר בתי המחסה (9). מכאן נמשיך ברחוב משגב לדך צפונה ונרד במדרגות \"מעלות רבי יהודה הלוי\" המובילות גם אל רחבת הכותל. נצא מהעיר העתיקה דרך שער האשפות, נפנה מזרחה (ימינה), נחצה את הכביש דרומה ברחוב מעלות דוד אל גן לאומי עיר דוד (10). נרד במדרגות אל פיר וורן (א) ונמשיך במנהרה התת-קרקעית אל בית המעיין ואל הברכה (ב). נעבור בין הביצורים ובין שרידי המגדל אל נקבת חזקיהו (ג). ניכנס לנקבה בפנסים ונצא ממנה אל שרידי ברכה ביזנטית. לאחר הביקור בעיר דוד, נצא מהמתחם אל רחוב מעלות דוד, נפנה בו צפונה, נחצה את רחוב העופל ונפנה מיד מזרחה אל הפינה הדרומית-מזרחית של החומה, אל שער חומת בית ראשון שבקרן העופל (11), שם מסתיים המסלול. ​", "start": "נקודת התחלה: פסיפס אמת המים בטיילת ארמון הנציב, נ\"צ UTM 753406/233991. נקודת סיום: טיילת העופל, מצפון למרכז המבקרים בעיר דוד.", "length": "5.6 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/hizkiyahu/", "pdf": "", "gmap": "https://www.google.com/maps/d/viewer?mid=152-PqrGIGeUydkAel3sZ_bUkYcA", "lat": 31.7534275, "lng": 35.2340287, "approx": false, "stops": [{"name": "גן פסיפס אמות המים (1)", "lat": 31.7534275, "lng": 35.2340287}, {"name": "אמת המים החשמונאית-מנהרת ארמון הנציב(2) (1)", "lat": 31.7527621, "lng": 35.2339548}, {"name": "תצפית ארמון הנציב (3)", "lat": 31.7545564, "lng": 35.2312392}, {"name": "רח' עשהאל (4) שכונת אבו תור", "lat": 31.7648405, "lng": 35.228527}, {"name": וד\". בעקבות דוד המלך, מייסד שושלת בית דוד – מטיילת ארמון הנציב, דרך הר ציון ועיר דוד ועד נקבת חזקיהו ומרכז דוידסון.", "desc": "ראשיתו של המסלול בנקודת תצפית מתצפית טיילת ארמון הנציב, טיילת האז (1), צפונה אל עבר עיר דוד והעיר העתיקה. מכאן, נלך מרחק של כ-2.5 קילומטרים לאורך רחוב אלבק בכיוון צפון ונתחבר לדרך חברון, החוצה את גיא בן הינום ממערב למזרח. מהרמזור הסמוך לחומות, מתפצלים הרחובות מעלה השלום וחטיבת ירושלים. נחצה את הכביש לכיוון מזרח ונעלה בשביל מעלה בני. נפנה ימינה ברחוב ארוונה היבוסי, נמשיך ברחוב הר ציון לקבר דוד (2) שבהר ציון. לאחר הביקור בקבר, נשוב צפונה אל חומות העיר ונלך מזרחה (ימינה) לאורך החומות עד שער האשפות. נפנה דרומה (ימינה), נחצה את רחוב דרך השלום ונפנה דרומה ברחוב מעלות דוד אל גן לאומי עיר דוד (3). נעלה במדרגות אל תצפית בית הצופה (א). לאחר מכן נרד במדרגות שבהן עלינו קודם ונמשיך למדרגות נוספות שיורידו אותנו אל מתחת לאדמה, לשרידים הארכאולוגים שמתחת מפלס המבקרים, הם שרידי הקריה המלכותית של ירושלים המקראית (ב). משם נרד דרומה אל עבר מערכת המים של העיר (ג) לפי השילוט לפיר וורן. נגיע אל שער מברזל, שומר יכניס אותנו אל מערכת המים של העיר, המבוססת על מקור המים העיקרי שלה – מעיין הגיחון. נרד במדרגות וכשנגיע לקרבת המעיין ניכנס לנקבת מים שבנה חזקיהו מלך יהודה. נלך בנקבה דרומה אל עבר ברכת השילוח, נמשיך במסלול התת-קרקעי ונפנה לכיוון צפון-מערב (ימינה) אל שילוט המורה אל תעלת הניקוז שמתחת לרחוב ההרודיאני (ד). נעלה צפונה אל עבר הכותל המערבי, ובקצה התעלה נצא אל הגן הארכאולוגי שבמרכז דוידסון (4), כאן מסתיים המסלול.", "start": "נקודת התחלה: תצפית מטיילת ארמון הנציב לכיוון צפון, אל עבר עיר דוד והעיר העתיקה. נקודת סיום: גן ארכאולוגי – מרכז דוידסון.", "length": "3 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/king-david/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/king_david.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1_--ENFxOWyaAwMEcggkV5_ehskk", "lat": 31.754466, "lng": 35.230822, "approx": false, "stops": [{"name": "טיילת ארמון הנציב (1) רח' דניאל ינובסקי", "lat": 31.754466, "lng": 35. ל 7 ו-15.\nנשוב על עקבותינו ברחוב דניאל ונצעד לרחוב אלישע. נפנה בו לכיוון דרום-מערב (ימינה) ונצעד במעלה הרחוב עד רחוב שבטי ישראל. ברחוב שבטי ישראל נלך דרומה (שמאלה) לבית החולים הצרפתי \"סנט לואיס\" (15) ברחוב שבטי ישראל 2. נמשיך דרומה לרחוב הצנחנים, ל\"כיכר צה\"ל\", נחצה את הכיכר מערבה לעבר בית העירייה ההיסטורי, נחצה את רחוב יפו ונפנה בו דרומה, נחצה את רחוב הצנחנים ונצעד במורד הרחוב לאורך החומה עד שער יפו, עד רחבת מדרגות הכניסה למרכז ממילא (16). נלך דרומה ונרד במדרגות המובילות לרחוב יצחק קריב, נחצה את הרחוב לכיוון \"פארק טדי\" ונלך מערבה ברחוב מטיבי נגן למקום שבו עמד בית טאנוס (17).\nכאן מסתיים המסלול.", "start": "נקודת התחלה: שכונת שמואל הנביא, רחוב ארץ חפץ ,106 .116-115", "length": "3.5 ק\"מ", "difficulty": "בינוני", "accessible": "כן", "catalog": "https://tiulim.education.gov.il/trips-katalog/seadia-marziano/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/marziano.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1zXfpj7E-GWOEPZRj1aiQGhRi4gQ", "lat": 31.7949142, "lng": 35.2235537, "approx": false, "stops": [{"name": "שכונת שמואל הנביא (1) ארץ חפץ 106 116,115", "lat": 31.7949142, "lng": 35.2235537}, {"name": "מעבר מנדלבאום(2) רח' חיל הנדסה פינת רח' שבטי ישראל 56", "lat": 31.7867372, "lng": 35.2267104}, {"name": "בית תורג'מן (3) רח' חיל ההנדסה 4", "lat": 31.7861709, "lng": 35.2267788}, {"name": "שכון רכבת על קו התפר(4) רח' חיל ההנדסה פינת רח' החומה החמישית 2", "lat": 31.7852394, "lng": 35.2271596}, {"name": "פינת סעדיה מרציאנו(6) רח' הנביאים פינת רח' שבטי ישראל", "lat": 31.7839342, "lng": 35.2247858}, {"name": "רחוב הע\"ח(6) רח' הע\"ח 2", "lat": 31.7835722, "lng": 35.2265551}, {"name": "בי\"סבית יעקב- בי\"ס לצילום עש נגר(7) רח' הע\"ח 9", "lat": 31.7827587, "lng": 35.2264795}, {"name": "המנזר הסלזיאני (8) הע\"ח 18", "lat": 31.7819248, "lng": 35.2264629}, {"name": "רחוב משמרות(9) רח' משמרות 2", "lat": 31.7821119, "lng": 35.2265547}, {"name": "ביתו של קוק דרעי(10) רח' משמרות 10", "lat": 31.7820595, "lng": 35.2273948}, {"name": "הבית הראשון של משפ' מרציאנ  17, "name": "שכונות ועדות בירושלים - בעקבות שלמה מוסאיוף", "topic": "שכונות ועדות בירושלים", "title": "בעקבות שלמה מוסאיוף", "story": "מבוכרה לירושלים: הרב שלמה מוסאיוף, גביר מבוכרה, מכר את ביתו ועלה לירושלים, שם היה ממייסדי שכונת הבוכרים המפוארת – \"יתנוססו ארמונים מפוארים\".", "desc": "המסלול מתחיל בביתו הזמני של שלמה מוסיוף (1), ברחוב יואל משה סולומון 9 בנחלת שבעה. נתקדם לרחוב שמאי ובו נפנה מערבה (שמאלה), ברחוב בן-הלל נפנה צפונה (ימינה) וברחוב יעבץ נפנה לכיוון צפון-מזרח (ימינה) אל בית יוסף מוסיוף (2) ברחוב יעבץ 3. נמשיך ברחוב עד לרחוב יפו, נחצה את רחוב יפו ונפנה בו לכיוון דרום-מזרח (ימינה).\nברחוב הרב קוק נלך לכיוון צפון-מזרח (שמאלה) אל בית משיח בורוכוף (3) ברחוב הרב קוק 4. נתקדם באותו כיוון אל רחוב הנביאים ןנלך בו מערבה (שמאלה) אל ביתו של קונרד שיק, בית התבור (4), ברחוב הנביאים 58. נחזור על עקבותינו ונפנה לכיוון צפון-מערב (שמאלה) ברחוב אתיופיה. נמשיך ברחוב אתיופיה עד רחוב שלמה זלמן בהר\"ן, ובו עד רחוב החרש (5), אל בתי המלאכה של בוני העיר האלמונים. נמשיך דרכנו לשכונת בית ישראל: מרחוב החרש נחזור לרחוב שלמה זלמן בהר\"ן, נפנה בו צפונה (ימינה) לרחוב מאה שערים, נלך לכיוון דרום-מזרח (ימינה) עד רחוב הרב זוננפלד, נפנה בו צפונה (שמאלה) ונתקדם עד מאפיית נחמה (6) ברחוב זוננפלד 3.\nנמשיך ברחוב זוננפלד עד לרחוב בצלאל אשכנזי, נלך בו לכיוון דרום-מערב (שמאלה) עד רחוב יואל, נפנה בו צפונה (ימינה) אל בית הכנסת של שלמה מוסיוף (7) ברחוב יואל 25. נתקדם כמה מטרים ברחוב ונפנה לכיוון צפון-מערב (שמאלה) לרחוב אדוניהו, אל בית כנסת חאג' אדוניהו (8) ברחוב אדוניהו 16. נעלה במעלה הרחוב אל בית כנסת היזדים (9) ברחוב אדוניהו 26. נלך לרחוב ישראל אהרון פישל, נפנה בו לכיוון דרום-מזרח (שמאלה) ונתקדם לרחוב הבוכרים. נפנה לכיוון דרום מזרח (שמאלה) אל בית דוידוף (10), ברחוב הבוכרים 10. נחזור אל רחוב ישראל אהרון פישל, נפנה בו לכיוון דרום-מערב (שמאלה) אל רחוב עזרא, ובו נפנה לכיוון דרום-מזרח (שמאלה) אל בית יהודיוף חפץ – \"הארמון\" (11) ברחוב עזרא 19.\nכאן מסתיים המסלול.", "start": "נקודת התחלה: רחוב יואל משה סלומון 9.", "length": "4 ק\"מ", "difficulty": "קל", "accessible": "כן", "catalog": "https://tiulim.ed 192], [31.79244, 35.2193], [31.79221, 35.21971], [31.79204, 35.21958], [31.79196, 35.21951], [31.79177, 35.21937], [31.79181, 35.21929]]}, {"pts": [[31.79181, 35.21929], [31.79177, 35.21937], [31.79164, 35.21927], [31.79138, 35.21906], [31.79101, 35.21875], [31.79124, 35.21833]]}], "walk_km": 2.4}, {"n": 18, "name": "שכונות ועדות בירושלים - בעקבות משפחת מיוחס", "topic": "שכונות ועדות בירושלים", "title": "בעקבות משפחת מיוחס", "story": "משפחת מיוחס – משפחה ותיקה שמסורתה נמשכת עד ימי שיבת ציון. חלוצים ופורצי דרך: מבית מיוחס בכפר השילוח, דרך משכנות שאננים ועד רחוב מיוחס ושערי צדק.", "desc": "מסלול הסיור מתחיל בבית מיוחס (1) שבכפר השילוח (סילוואן). נגיע אליו דרך רחוב מעלות דוד. נלך ברחוב מעלות דוד בכיוון דרום, נעבור את מרכז המבקרים של עיר דוד ונפנה מזרחה (שמאלה) לסמטה הראשונה ללא שם. נמשיך בה עד לשלט ציר הזכוכית, שם נפנה דרומה (ימינה) ונלך עד לשלט המציין \"בית מיוחס\" (כדי להגיע לבית מיוחס, יש לפתוח שער שבצדה המזרחי של הסמטה. אם הוא סגור, יש לצלצל בפעמון שמשמאל לו).\nבתום הביקור במתחם הבית, נחזור על עקבותינו ונעלה ברחוב עד לצומת הרחובות מעלות דוד, דרך העופל ומעלה שלום. נפנה מערבה (שמאלה) ונלך עד שער האשפות. נעבור בשער ונמשיך לעבר הכותל המערבי (2). נצא מהכותל לכיוון שער האשפות, נפנה מערבה ונעלה ברחוב בתי מחסה לרחוב משמרות הכהונה. נלך צפונה (ימינה) ברחוב משמרות הכהונה עד לארבעת בתי הכנסת הספרדיים. נרד במדרגות לבית הכנסת \"יוחנן בן זכאי\" (3).\nנמשיך ברחוב משמרות הכהונה צפונה לכיוון \"כיכר המקובלים\", נחצה את הכיכר מזרחה, בקו כמעט ישר, ונגיע לבית הכנסת הקראי (4) ברחוב הקראים 12. מכאן נחזור על עקבותינו עד לקרדו, נחצה אותו לעבר רחוב חב\"ד, נפנה דרומה (שמאלה) ונמשיך לכיוון שער ציון. נצא משער ציון ונלך מערבה (ימינה) ברחוב חטיבת עציוני עד לקצה החומה.\nנמשיך מערבה לעבר רחוב ארוונה היבוסי ונרד במעלות בני. נחצה את דרך חברון לעבר ברכת הסולטן ונמשיך משם מערבה. נעלה שלושה גרמי מדרגות החוצים את רחוב ש\"א נכון ונגיע לשער הכניסה למשכנות שאננים. נעבור בדלת עץ מסיבית ונצפה דרך השער המתכתי אל משכנות שאננים. נמשיך ברחוב משכנות שאננים לכיוון צפון עד למקום שבו התגורר רבי שמואל יום-טוב מיוחס (5), ברחוב המבשר 3. נלך ברחוב המבשר לכיוון צפון עד רחוב המגדל, נפנה מזרחה (ימינה), נחצה את רחוב ש\"א נכון ונרד עד לשביל ללא שם. נפנה בו צפונה לכיוון \"חוצות היוצר\" ופארק טדי ונחצה את הפארק לכיוון רחוב יצחק קריב. נחצה את הרחוב צפונה ונעלה במדרגות לכיוון גשר הולכי הרגל המחבר את חוצות ממילא עם שער יפו.\nנלך בגשר לכיוון צפון, לרחוב חטיבת ירושלים ועד \"כיכר צה\"ל\". נחצה את \"כיכר צה\"ל\" לכיוון צפון-מערב ונלך למשרדי מחלקת הנוער של עיריית ירושלים (6) ברחוב יפו 19. נמשיך ברחוב יפו לרחוב נבון ונפנה בו צפונה לשכונת שערי צדק. נלך עד רחוב נתיב יצחק ומשם ל\"חצר\" של שכונת שערי צדק (7). במפה, המשך הרחוב נקרא גם הוא נתיב יצחק, אך הכתובות על תיבות הדואר מציינות כי הגענו לרחוב נבון. מהחצר נמשיך צפונה לסמטה ללא שם, ונלך בה מערבה עד לבית הכנסת \"בית שלמה\" (8). נמשיך בסמטה עד רחוב גיטל דינוביץ, נפנה שוב צפונה (ימינה) ונלך לרחוב אלפנדרי. נפנה בו מזרחה (ימינה) ונלך עד לרחוב תחכמוני. נפנה דרומה למשולש הרחובות תחכמוני, דוד ילין ומיוחס (9).\nנעלה ברחוב מיוחס עד ל\"כיכר ולירו\" (10). נמשיך דרומה אל רחוב יפו, נחצה אותו לכיוון דרום אל רחוב מחנה יהודה, נחצה את רחוב אגריפס לכיוון דרום ונלך ברחוב שילה עד רחוב בצלאל. נחצה את רחוב בצלאל ונפנה מזרחה (שמאלה) לרחוב אוסישקין, ובו נלך דרומה (ימינה) עד שדרות בן מימון. נחצה את שדרות בן מימון ונמשיך ללכת ברחוב רד\"ק עד רחוב עזה. נפנה לכיוון דרום-מערב ונלך עד רחוב האר\"י. נמשיך בו עד רחוב חרל\"פ. נלך ברחוב חרל\"פ בכיוון דרום-מערב עד רחוב הפלמ\"ח. נתקדם ברחוב הפלמ\"ח לכיוון דרום-מערב עד לרחוב כובשי קטמון, ובו נלך דרומה (ימינה) עד רחוב הל\"ה – שיוביל אותנו לרחוב רחל אמנו. ברחו ברחל אמנו נפנה לכיוון דרום-מזרח (שמאלה), לבית מרים ויוסף מיוחס (11).\nכאן מסתיים המסלול.", "start": "נקודת התחלה: בית מיוחס בכפר השילוח.", "length": "7 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/meyuhas-family/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/myochs.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1qSNzXwdPywuXpinV6SQqhgf5W9U", "lat": 31.7713911, "lng": 35.2360762, "approx": false, "stops": משה ומזכרת משה.", "desc": "ראשיתו של המסלול במעלה רח' ימין משה נרד שני גרמי מדרגות ונפנה דרומה ומזרחה אל תצפית גג משכנות שאננים (1) רח' ימין משה , בסמוך ניצבת טחנת הרוח (2) שהקים משה מונטיפיורי לטובת פרנסת שיצאו מחומה. נחזור לרח' ימין משה ונרד בו אל הסמטאות ,נפנה צפונה(שמאלה) אל תחילת רח' טורא(3) נשוב אל רח' ימין משה ונמשיך במורד המדרגות ונפנה דרומה אל רח' המבשר שיהפוך למשכנות שאננים עד המדרגות שנמצאות מול שער עץ ונעמוד אל מול הבית הגדול(4) רח' משכנות שאננים. נחזור על עקבותינו אל מרכז ג'ינוגלי. בקומת המסד של המבנה נטוע עץ תאנה ובעורפו דלת ברזל מאחוריה היה התנור השכונתי (5) רח' משכנות שאננים .נמשיך בין הסמטאות צפונה ברח' המבשר נחצה את רח' ימין משה ונמשיך ברח' מלאכי נפנה מזרחה(ימינה) ברח' המגדל וצפונה (שמאלה) ברח' פלאי יועץ ,כשתחילתו נמצא בית הכנסת האשכנזי \"בית ישראל\" ובהמשכו בית הכנסת הספרדי \"ישמח משה\" (6) לאחר מכן נעשה פעמנו אבן זיכרון לאברהם מיכאל קירשנבאום(7) רח' המצודה פינת רח' התקווה, בן המקום שנפל על הגנת השכונה במלחמת העצמאות. מנקודה זו נעשה דרכנו אל השכונות אוהל משה ומזכרת משה חלק ממתחם השוכנות שנקרא \"נחלאות\" .נצא משכונת ימין משה דרך רח' ימין משה אל כיכר פלומר ,נפנה בה צפון מערב(ימינה) ברח' קן היסוד ,נחצה את כיכר צרפת ונמשיך ברח' המלך ג'ורג' ,נפנה מערבה(ימינה) וצפונה ברח' שמואל הנגיד, נחצה את כיכר עקיבא גוברין ונשיך ישר דרך רח' מרדכי עליאש עד כיכ ברב יעקב ברוך נפנה בה מערב(ימיה) לרחוב אגריפס עד לשער הכניסה לשכונת אוהל משה(8) רח' אגיפס 87 פינת רח' החרמון , נכנס דרך השער ונלך ברח' החרמון דרומה אל החצרות ובור המים(9) רח' הגלבוע 11 . דרך רח' הגלבוע נמשיך אל רח' מזכרת משה ונפנה דרומה (ימינה ) עד לבית הכנסת אוהל משה (10) רח'אריה(רבי אריה) לוין 31 פינת רח' מזכרת משה. נמשיך מזרחה ברח' אריה לוין (רבי אריה) ונפנה צפונה(שמאלה) ברח' עיניים למשפט אתו נגיע אל הגן הציבורי(11) רח' עיניים למשפט 2, נצא מהגן אל רח' הכרמל ונפנה מאבה (שמאלה) אל בית הכנסת חסד ורחמים (12) רח' הכרמל מכאן דרך הסמטה המזרחית לבית הכנסת נצא דרך שער הכניסה של שכונת מזכרת משה(13) חזרה אל רח' אגריפס( לבאים מרח' אגריפס שער הכניסה למזכרת משה נמצא ברח' אגריפס 63 )", "start": "נקודת התחלה: משכנות שאננים גג התצפית ליד טחנת הקמח רח' ימין משה נקודת הסיום: רח' אגריפס 63", "length": "4 ק\"מ", "difficulty": "קל", "accessible": "חלקי-הקפצה", "catalog": "https://tiulim.education.gov.il/trips-katalog/moshe-montifuri/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/monrifuri.pdf", "gmap": "", "lat": 31.772, "lng": 35.224, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 20, "name": "שכונות ועדות בירושלים - בעקבות יצחק נבון", "topic": "שכונות ועדות בירושלים", "title": "בעקבות יצחק נבון", "story": "יצחק נבון, הנשיא החמישי, נולד בירושלים ושזר בה \"סל תרבות\": משכונת אוהל משה שבה גדל, דרך בית הנשיא ועד חלקת גדולי האומה בהר הרצל.", "desc": "מסלול הסיור מתחיל בבית משפחת נבון (1) ברחוב הגלבוע 11. נלך ברחוב לכיוון צפון עד לגן הציבורי גן \"הבוסתן הספרדי\" (2) ברחוב הגלבוע 9. מהגן נלך ברחוב הכרמל מזרחה ונפנה דרומה (ימינה) ברחוב מזכרת משה עד לרחוב ר' אריה לוין. נפנה מערבה (שמאלה) ברחוב ר' אריה לוין, ורחוב ר' אריה לוין 31 פינת רחוב אוהל משה נמצא בית הכנסת הגדול \"אוהל משה\" (3). \nנחזור על עקבותינו ונלך צפונה ברחוב מזכרת משה עד רחוב אגריפס. נחצה את רחוב אגריפס ונפנה בו לכיוון צפון-מערב (שמאלה). נפנה ברחוב עץ החיים צפונה אל שוק מחנה יהודה (4) ונחצה את השוק לרחוב יפו. נלך ברחוב יפו דרום מזרח (ימינה), במקביל למסילת הרכבת הקלה, עד לצומת הרחובות יפו וכי\"ח. נחצה את הכביש ונלך ברחוב כי\"ח לכיוון צפון. נחצה את הצומת הקרוב לכיוון צפון-מזרח (ימינה) לעבר רחוב הנביאים. נלך ברחוב זה עד לצומת המרומזר הבא ובו נפנה צפונה (שמאלה) לרחוב ישעיהו ונמשיך בו עד פינת רחוב ישעיהו ורחוב דויד ילין, שם, מול בית ספר \"למל\" עמד בית ספר \"דורש ציון\" (5), כיום שוכנים במקום מוסדות התורה \"עץ החיים\". בתום הביקור במקום, נחצה את רחוב ישעיהו לכיוון מזרח ונעמוד מול חזיתו המשומרת של קולנוע \"אדיסון\" (6), ברחוב ישעיהו 14 פינת רחוב סימה בליליוס. מכאן, נשוב ברחוב ישעיהו לרחוב הנביאים, נלך בו מזרחה עד לצומת המרומזר של רחוב הנביאים ורחוב שטראוס, נפנה דרומה (שמאלה) בצומת לרחוב שטראוס ובהמשכו ברחוב המלך ג'ורג' עד לבית פרומין – מבנה הכנסת הישן, מוזאון הכנסת (7) ברחוב המלך ג'ורג' 24. \nנמשיך דרומה לרחבת בתי המוסדות הלאומיים (8) ברחוב המלך ג'ורג' 48 פינת רחוב קק\"ל, שבו הכניסה למקום, ובתום הביקור נלך דרומה ברחוב המלך ג'ורג' לצומת רחוב גרשון אגרון (\"כיכר צרפת\"). נמשיך ברחוב אגרון לכיוון צפון-מזרח עד לפנייה דרומה (ימינה) לרחוב המערביים. ברחוב המערביים 13 נמצא המרכז העולמי ליהודי צפון אפריקה (9). \nנחזור על עקבותינו ל\"כיכר צרפת\" ונפנה לכיוון דרום-מזרח (שמאלה) אל רחוב קרן היסוד. נלך ברחוב קרן היסוד עד רחוב אחד העם, ובו נפנה דרומה (ימינה) לרחוב זאב ז'בוטינסקי, שם נלך מערבה (ימינה) אל ביתו של יצחק נבון (10) ברחוב ז'בוטינסקי 39. נמשיך מערבה ברחוב שבהמשכו נקרא רחוב הנשיא עד למשכן הנשיא (11) ברחוב הנשיא 3. \nכאן מסתיים המסלול הרגלי. ניסע להר הרצל, אל חלקת קברם של יצחק נבון ושל רעיתו (12) בחלקת גדולי האומה. כאן מסתיים המסלול.", "start": "נקודת התחלה: רחוב אגריפס 83.", "length": "4.5 ק\"מ", "difficulty": "בינוני", "accessible": "כן", "catalog": "https://tiulim.education.gov.il/trips-katalog/itzhak-navon/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/navon.pdf", "gmap": "", "lat": 31.7845, "lng": 35.213, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 21, "name": "שכונות ועדות בירושלים - בעקבות יוסף ריבלין", "topic": "שכונות ועדות בירושלים", "title": "בעקבות יוסף ריבלין", "story": "ר' יוסף ריבלין – \"ר' יושעה בונה השכונות\" – יזם פרטי פורץ דרך שהוביל את היציאה מהחומות: נחלת שבעה, אבן ישראל, משכנות ישראל, מזכרת משה ועוד.", "desc": "המסלול מתחיל בכניסה לנחלת שבעה, בצומת הרחובות יוסף ריבלין ויואל משה סלומון. משם נתקדם צפונה אל נחלת שבעה דרך רחוב יואל משה סלומון. ברחוב אריה לייב הורוביץ, נפנה ימינה (מזרחה). נגיע לרחוב מעלות נחלת שבעה ונפנה בו שמאלה (צפונה) אל בית הכנסת \"נחלת יעקב\" (1) ואל בית הכנסת \"אוהל יצחק\" (2).\nנחזור על עקבותינו דרומה ברחוב מעלות נחלת שבעה עד לרחוב יוסף ריבלין – נפנה שמאלה וניכנס לרחוב. בבית מספר 14, ניכנס אל מבואת חצר שבה בור מים (3). משם נמשיך ברחוב צפונה אל בית מספר 2, בית יואל (4) ובית ריבלין (5), אל \"כיכר ריבלין\" ואל המזרקה. בצומת הרחובות ריבלין ויפו נפנה שמאלה (מערבה), נלך ברחוב יפו ונחצה בדרכנו את \"כיכר ציון\" ואת צומת הרחובות יפו-קינג ג'ורג'. נמשיך ברחוב יפו עד לצומת הרחובות יפו-אבן ישראל. נפנה באבן ישראל דרומה ונלך עד לרחוב אגריפס. נפנה ימינה (מערבה) באגריפס, נחצה את \"כיכר הרב יעקב ברוך\" ומיד נגיע אל צומת סמטת משיח בורוכוף.\nנפנה ימינה (צפונה) בסמטה ונגיע אל הכיכר המרכזית בשכונת אבן ישראל (6). נחזור דרומה בסמטת משיח בורוכוף לרחוב אגריפס ונפנה בו ימינה (מערבה). נמשיך לצומת הרחובות אגריפס ומשכנות ישראל וניכנס אל שכונת נחלאות. נמשיך דרומה עד לרחוב הרב לוין, שם נפנה מערבה (ימינה) ונתקדם לבית מספר 7, ביתו של הרב אריה לוין (7). נמשיך לצומת הרחובות אריה לוין ומזכרת משה. נפנה צפונה (ימינה) בשכונת מזכרת משה ומיד מערבה (שמאלה) לשכונת אוהל משה.\nנחצה את רחוב אוהל משה לרחוב הגלבוע, ובו נפנה צפונה (ימינה) לבית משפחת נבון (8) ולבור המים הסמוך לו. נמשיך ברחוב הגלבוע עד לרחוב הכרמל. בפינת הרחובות, נמצא גן התות \"בוסתן ספרדי\" (9). משם נפנה מערבה עד לרחוב רפאל עזרא, ובו נפנה דרומה עד לצומת הבא. שם נפנה מערבה (שמאלה) ונגיע לרחוב זיכרון טוביה (10) בשכונת זיכרון טוביה. נצא משכונת זיכרון טוביה לכיוון צפון, נפנה מערבה (שמאלה) ומיד צפונה (ימינה) ברחוב שילה, נגיע אל רחוב אגריפס, מול שוק מחנה יהודה – כאן מסתיים המסלול.", "start": "נקודת התחלה: כניסה לנחלת שבעה בצומת הרחובות יוסף ריבלין ויואל משה סלומון.", "length": "3 ק\"מ", "difficulty": "קל", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/yoseff-rivlin/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/rivlin.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1iakiHMZmUlzKAqX_ANvE-xv8LO8", "lat": 31.7809459, "lng": 35.2200991, "approx": false, "stops": [{"name": "בית הכנסת נחלת יעקב (1) מעלות נחלת שבעה 3", "lat": 31.7809459, "lng": 35.2200991}, {"name": "בית הכנסת מעלות יצחק(2) רחוב מעלות נחלת שבעה  6", "lat": 31.7809891, "lng": 35.2202287}, {"name": "מבואת חצר עם בור מים (3)רח' יוסף רבלין 14", "lat": 31.7804373, "lng": 35.2204141}, {"name": "בית יואל (4) רח' יוסף ריבלין 1פינת יפו 33", "lat": 31.7812597, "lng": 35.2207512}, {"name": "ביץ רבלין (5) רח' יוסף ריבלין 2", "lat": 31.7810873, "lng": 35.2206463}, {" נה בסמטה קטנה מזרחה (שמאלה), נעלה לרחוב אוסישקין ונפנה בו צפונה (שמאלה). נצעד ברחוב אוסישקין בכיוון דרום 450 מטרים עד ל\"כיכר מולכו\" בצומת רחוב בן-מימון. מכאן נמשיך לכיוון דרום-מזרח ברחוב רד\"ק כ-150 מטרים עד דרך עזה. נלך לכיוון דרום-מערב (ימינה) עד לצומת הרחובות האר\"י ובנימין מטודלה. רחוב האר\"י מתעקל דרומה (שמאלה), ולאחר כ-150 מטר, במזלג הרחובות, נמשיך ברחוב חרל\"פ עד ישיבת \"קול תורה – אוהל רבקה\" (3) ברחוב חרל\"פ 15. נשוב על עקבותינו לצומת הרחובות עזה ורד\"ק ונעלה לכיוון צפון-מזרח בדרך עזה, שבהמשכה נקראת שדרות בן-מימון, עד \"כיכר צרפת\". נפנה צפונה (שמאלה) ברחוב המלך ג'ורג' אל המבנה שבו ישבה זמנית ישיבת \"קול תורה\" (4), ברחוב המלך ג'ורג' 47. מכאן נפנה מערבה (שמאלה) ברחוב הקרן הקיימת לישראל ונפסע בו מערבה עד רחוב אוסישקין, ובו נפנה צפונה (ימינה) אל בית הספר \"אוולינה דה רוטשילד\" (5) ברחוב אוסישקין 38. נלך צפונה לצומת הרחובות אוסישקין ובצלאל, נחצה את רחוב בצלאל ונרד בו לכיוון צפון-מערב (שמאלה) כ-50 מטר, עד למדרגות מצפון לנו (מימין). נעלה במדרגות צפונה לרחוב שילה, נלך לאורכו ונחצה את שכונת נחלאות עד לרחוב אגריפס. נחצה את רחוב אגריפס ונפנה מזרחה (ימינה) ומיד צפונה (שמאלה) אל רחוב מחנה יהודה. נחצה את שוק מחנה יהודה עד לרחוב יפו. נלך בו מזרחה (ימינה) כ-50 מטר לחנויות \"עץ חיים\", התוחמות חלק ניכר מהרחוב, ולשער הכניסה למתחם תלמוד התורה \"עץ חיים\" (6) ברחוב יפו 113. נמשיך ברחוב יפו בכיוון דרום-מזרח, נחצה את מסילת הרכבת הקלה אל רחוב הרב קוק ונלך בו לכיוון צפון-מזרח אל בית הרב קוק (7) ברחוב הרב קוק 9. כאן מסתיים המסלול.", "start": "נקודת התחלה: רחוב מרדכי נרקיס פינת רחוב הירשנברג בשכונת שערי חסד. נקודת סיום: רחוב הרב קוק 9.", "length": "5 ק\"מ", "difficulty": "קל", "accessible": "כן", "catalog": "https://tiulim.education.gov.il/trips-katalog/zalman-uyrbach/", "pdf": "", "gmap": "https://www.google.com/maps/d/viewer?mid=1W_HwqQrIl5JLcelzDkFRd-zACao", "lat": 31.7791865, "lng": 35.2117753, "approx": false, "stops": [{"name": "שער הכניסה לשערי חסד(1) רח' מרדכי נרקיס פינת רח' הירשנברג", "lat": 31.7791865, "lng": 35.2117753}, {"name": "ביתו של הרב אויירבך (1) רח' פרוש 11", ו עם רחוב בצלאל. נחצה את הרחוב, נפנה מזרחה (ימינה) ונמשיך לרחוב מסילת ישרים, נלך בו לכיוון צפון-מזרח (שמאלה) עד למפגש עם רחוב שומרון. בנקודה זו, נביט לעבר בתי גורל (3), הנמצאים ברחוב אבולעפיה. נלך דרומה ברחוב שומרון עד למפגש עם רחוב התבור, שבו נפנה מערבה (ימינה) אל המקווה של בתי ראנד (4), הנמצא במפגש בין רחוב הנצ\"יב ורחוב התבור, ואל בתי ברוידא (5) ברחוב התבור 8. מבתי ברוידא נפנה מזרחה עד למפגש עם רחוב שומרון, נפנה ברחוב שומרון צפונה (שמאלה) עד למפגש עם רחוב אגריפס, וברחוב אגריפס נפנה מזרחה (ימינה) אל החנות החברתית \"קלפטע\" (6) ברחוב אגריפס 32. נחצה את הכביש צפונה אל סמטת משיח בורוכוף ונלך בה עד רחוב יפו. ברחוב יפו 91 עמד בית היתומים הספרדי (7), כיום נמצא במקום בית הספר \"עתידך אב-חי\". נמשיך ברחוב יפו לכיוון צפון-מערב עד מפגשו עם רחוב כי\"ח, נלך דרומה (שמאלה) ברחוב כי\"ח עד הגיענו לחניון הדרומי של שוק מחנה יהודה, שבמרכזו נמצא בניין \"רוח חדשה\" של בית הספר \"כי\"ח אליאנס\" (8), כאן מסתיים מסלול הסיור.", "start": "נקודת התחלה: רחוב אבן ספיר 5. נקודת סיום: בית הספר \"כי\"ח אליאנס\" (חניון דרומי של השוק).", "length": "3 ק\"מ", "difficulty": "קל", "accessible": "כן", "catalog": "https://tiulim.education.gov.il/trips-katalog/bracha-kapach/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/kapach.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=14WfpXdv5uk9Eo-bpx7g3uxBJ_Wo", "lat": 31.7812999, "lng": 35.2111941000001, "approx": false, "stops": [{"name": "בית הכנסת \"אבי דוד\"(1)אבן ספיר 5", "lat": 31.7812999, "lng": 35.2111941000001}, {"name": "הבגדיה (2) רח' שפרעם 11", "lat": 31.7793928, "lng": 35.2115049}, {"name": "בתי גורל (3) רח' הרב חיים אבולעפיה", "lat": 31.7826416, "lng": 35.2145176}, {"name": "בתי ברוידא(5) רח' תבור 8", "lat": 31.7824119, "lng": 35.2137393}, {"name": "ביתי ראנד(4) רח' הנצי\"ב 8", "lat": 31.781847, "lng": 35.2136562000001}, {"name": "קלפטע -חנות חברתית(7)רח' אגריפס 32", "lat": 31.7832127, "lng": 35.2155596}, {"name": "בית היתומים הכללי ע\"ש משיח בורוכוף (6) סמטת בורוכוף פינת רח' יפו 91", "lat": 31.7840716, "lng": 35.2158651}, {"name" . נחזור מערבה עד למפגש עם רחוב מזכרת משה, ונפנה צפונה (ימינה) עד רחוב אגריפס. נחצה את הכביש ונפנה מערבה (שמאלה) ומיד צפונה (ימינה) ונלך לאורך רחוב עץ החיים עד רחוב יפו 92, אל בית כנסת \"זהרי חמה\" (3), שבו התפלל ר' אריה השכם כל בוקר עד מותו. מול בית הכנסת נמצאת ישיבת \"עץ החיים\" (4). נרד לאורכו של רחוב יפו לכיוון מזרח, נחצה את כיכר הדוידקה ביפו 89 ונפנה דרומה (ימינה) אל סמטה צרה, רחוב משיח בורוכוף. נלך כמה מטרים בצדה המערבי של הסמטה (מימין), ניכנס לחצר בית היתומים הספרדי ונעלה לבית הכנסת \"אחדות ישראל\" ע\"ש עולי הגרדום (5). נחזור לרחוב יפו ונפנה מזרחה (ימינה), נלך לאורך הרחוב הראשי עד בית מספר 46, שם נפנה צפונה (שמאלה) לרחוב הרב קוק ונלך בו עד מפגשו עם רחוב טיכו. נפנה מערבה (שמאלה) אל ביתו של הרב קוק (6). משם נחזור לרחוב הרב קוק, נפנה צפונה (שמאלה) במעלה הרחוב, וברחוב הנביאים נפנה מזרחה (ימינה). נפנה שוב דרומה (ימינה) ברחוב מונבז, נלך לאורכו, נחצה את רחוב הלני המלכה וניכנס לרחוב משה זמורה. בכיכר שבמגרש הרוסים, מול המשטרה והכנסייה, נפנה שמאלה לרחוב חשין. אחרי שנעבור את בתי המשפט, נפנה מזרחה (שמאלה) ונלך במורד רחוב משעול הגבורה בצד צפון (שמאל). ניכנס למוזאון אסירי המחתרות (7). לאחר הביקור במוזאון, נרד אל רחוב שבטי ישראל ונפנה דרומה (ימינה ) אל הכניסה המזרחית של כיכר ספרא (8), שבטי ישראל 9 (ליד פסל האריה) שם מסתיים המסלול. \n---- \nבעקבות קרבות שהתנהלו באזור ירושלים בתש\"ח , בין הנופלים להגנת המולדת היו חללי נצר אחרון. שהינם חללי צה\"ל ניצולי שואה שעלו ארצה בגפם לאחר שנותרו שריד אחרון ממשפחתם שנספתה בשואה, ונפלו בקרבות על שחרור המולדת. סיפורם של : מרדכי גוטמן | \nשמואל הירש\n | \nנתנאל זויער", "start": "נקודת התחלה: רחבת ז'ראר בכר, רחוב בצלאל פינת רחוב טרומפלדור. נקודת סיום: כיכר ספרא", "length": "3 ק\"מ", "difficulty": "קל", "accessible": "נגיש ברובו", "catalog": "https://tiulim.education.gov.il/trips-katalog/aria-levin/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/levin.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1Lgs3Uom5DQB_4dcAMumksp4GWng", "lat": 31.7823421, "lng": 35.2135049999999, "approx": false, "stops": [{"name": "בתי ברוידא (1) רח' ת  רוגל, שם נפנה שמאלה לכיוון מערב ונלך עד צומת גדול הסמוך למתחם התחנה הראשונה. נמשיך בכיוון צפון-מערב ברחוב דוד רמז, רחוב דוד המלך ורחוב קרן היסוד, מרחק של כ-1,300 מטר, עד שנגיע לבניין המוסדות הלאומיים (5). משם נמשיך מערבה ברחוב קרן קיימת עד לגימנסיה העברית (6), שבה לימדו בני הזוג בן-צבי, ונסיים ברחוב אבן גבירול 14, ביד יצחק בן-צבי (7). בנקודה זו מסתיים המסלול.​\nError 404", "start": "נקודת התחלה: חוות הלימוד החקלאית בארמון הנציב ליד כיכר \"שרמן\". נקודת סיום: יד יצחק בן-צבי ברחוב אבן גבירול 14 ברחביה.", "length": "4.5 ק\"מ", "difficulty": "קל", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/ben-zvi/", "pdf": "", "gmap": "", "lat": 31.753, "lng": 35.227, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 34, "name": "מעמק הצבאים לפארק המסילה, דרך הקטמונים", "topic": "מסלולי עיר ונוף", "title": "מעמק הצבאים לפארק המסילה, דרך הקטמונים", "story": "מעמק הצבאים העירוני, דרך שכונות הקטמונים – שכונות העולים של שנות ה-50 – ועד פארק המסילה ומתחם התחנה הישנה.", "desc": "נתחיל בעמק הצבאים (1), משם נלך לצומת פת-הרב הרצוג ולאורך רחוב פת. נרד לרחוב בר יוחאי (2) ונחזור לרחוב פת, נפנה שמאלה לרחוב ניתאי הארבלי ואחר כך ימינה לרחוב יוסי בן יועזר. נמשיך ברחוב עד שנראה משמאלנו, במפגש רחוב בן יועזר עם רחוב רבי תנחומא, גינה (3). נמשיך ברחוב יוסי בן יועזר עד עלייה שמאלה לרחוב אליעזר הגדול. מעט אחרי הפנייה, ניכנס ימינה לשיכוני אנטינוגוס (4) ולבוטקה המוצב במקום (5). נמשיך לעלות עוד קצת עד לבית כנסת \"זכות אבות\" (6). נתקדם ברחוב רבי יוחנן בן זכאי עד לירידה לשביל הקטמונים (7). נלך בשביל הקטמונים עד לפארק גוננים-מקור חיים (8), נעצור בנקודה כלשהי בדרך להסבר על הפארק (9). נמשיך ללכת עד הפנייה לרחוב מסריק (10), ומשם למתחם התחנה הראשונה (11).", "start": "נקודת התחלה: עמק הצבאים. נקודת סיום: מתחם התחנה.", "length": "3.5 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/katamonim/", "pdf": "", "gmap": "", "lat": 31.763, "lng": 35.195, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 35, "name": "מנהיגים וחלוצים בירושלים - בעקבות מנחם בגין", "topic": "מנהיגים וחלוצים בירושלים", "title": "בעקבות מנחם בגין", "story": "מנחם בגין – מפקד האצ\"ל וראש הממשלה. ממוזיאון אסירי המחתרות, דרך בית פרומין (הכנסת הראשונה), ביתו הראשון ומלון המלך דוד ועד מרכז מורשת בגין.", "desc": "המסלול מתחיל במוזאון אסירי המחתרות (1), ברחוב משעול הגבורה 1. משם נלך בכיוון דרום-מערב לרחוב חשין עד התחברו לרחוב יפו, נפנה לכיוון צפון-מערב (ימינה) ונלך עד בית מספר 44 ברחוב יפו, שם עמד מלון \"תל-אביב\" (2), היום מלון \"רון\". נחצה בזהירות את רחוב יפו לכיוון \"כיכר ציון\" (דרום-מערב) ונעלה ברחוב בן-יהודה לכיוון דרום-מערב עד רחוב המלך ג'ורג' החמישי, שם נפנה דרומה אל \"בית פרומין\" (3) – מקום משכנה של כנסת ישראל בעבר. נחזור לאחור ונפנה מערבה ברחוב בארי אל רחוב שמואל הנגיד, ובו נפנה שמאלה (דרומה) ומיד נמשיך מערבה ברחוב בצלאל עד \"מרכז ז'ראר בכר\" בבניין מספר 11 ברחוב בצלאל. מול \"מרכז ז'ראר בכר\" כיכר שבעבר נקרא \"כיכר מנורה\" (4). נצא מהכיכר דרומה לרחוב מנורה, נלך עד רחוב אוסישקין, ובו עד רחוב בן-מימון, נחצה את הרחוב לכיוון דרום-מזרח אל רחוב רד\"ק, ובנקודת מפגשו עם רחוב אבן-עזרא נפנה ימינה אל רחוב אלפסי, אל בית מספר 25 – ביתו הראשון של בגין בירושלים (5). נשים פעמינו חזרה מזרחה (ברחוב אלפסי) ונפנה ימינה לרחוב אפודי, נרד ברחוב עד לרחוב בנימין מטודלה, שם נפנה שמאלה ונלך ברחוב המתעקל מעט עד לרחוב עזה. נפנה שמאלה ונמשיך עד רחוב בן-מיימון. מעט אחרי מפגש הרחובות, נמצאת \"כיכר דניאל אוסטר\". נעמוד בכיכר ונביט לכיוון דרום (ימינה ואחורה אל רחוב בלפור), שם נראה את בית ראש הממשלה (6). נמשיך ברחוב בן-מיימון עד \"כיכר צרפת\" (בכיוון צפון-מזרח), מהכיכר נצא לכיוון דרום-מזרח (ימינה) אל רחוב קרן היסוד, נחצה את הרחוב למדרכה המזרחית ונתקדם לרחוב לינקולן. נלך ברחוב לינקולן עד התחברו עם רחוב ושינגטון, נמשיך ברחוב ושינגטון בכיוון צפון-מזרח (שמאלה) עד שנתחבר שוב עם רחוב לינקולן, נמשיך ברחוב לינקולן עד רחוב המלך דוד ונפנה דרומה (ימינה) אל מלון המלך דוד (7). מול המלון ניצב בניין ימק\"א. מכאן נמשיך דרומה עד למפגש רחוב דוד המלך עם רחוב ש\"א נכון, נפנה לכיוון צפון-מזרח (שמאלה) אל הרחוב נמשיך בו עד \"מרכז מורשת בג ות צ'רצ'יל, שם מסתיים המסלול.", "start": "נקודת התחלה: רחוב אוסישקין ,7 \"בית מחניים\" רחביה. נקודת סיום: מערת ניקנור בגן הבוטני, הר הצופים.", "length": "6 ק\"מ", "difficulty": "קל", "accessible": "כן", "catalog": "https://tiulim.education.gov.il/trips-katalog/alenbi/", "pdf": "", "gmap": "", "lat": 31.7907, "lng": 35.2045, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 39, "name": "מנהיגים וחלוצים בירושלים - בעקבות אברהם סימון", "topic": "מנהיגים וחלוצים בירושלים", "title": "בעקבות אברהם סימון", "story": "משואה לתקומה: עולים ניצולי שואה ומצפון אפריקה שהגיעו במלחמת העצמאות ונפלו בהגנת ירושלים. משכונת מלחה, דרך יד ושם ועד הר הרצל.", "desc": "המסלול מתחיל בתצפית בשכונת מלחה (2-1). נקיף את המסגד ונרד בסמטות השכונה ברחוב קדושי סטרומה צפונה לשכונת רמת-שרת. נחצה את צומת רחוב גולומב עם רחוב שרת ונגיע ל\"כיכר הח\"י\" ולאנדרטה לזכר הנופלים (3). נמשיך צפונה (צפון-מערב) ברחוב גולומב עד רחוב יעקב טהון, נפנה ימינה לרחוב ישראל זנגוויל, ושוב ימינה ברחוב ארתור הנטקה לכיוון קריית יובל. נמשיך עד \"כיכר הולנד\". במהלך דרך זו, מרחוב יעקב טהון ועד \"כיכר הולנד\", נעצור לתצפית (4). נמשיך מערבה לכיוון עין כרם אל אתר יד-ושם וניכנס לבקעת הקהילות לזכר יהדות רומניה והונגריה (5) (מצ\"ב מפת האתר, נקודה 23). נתקדם לעבר \"השביל המחבר\" בין יד-ושם והר הרצל. נלך אל אנדרטת נצר אחרון (6) בהר הרצל, וממנה נמשיך אל האתר האחרון במסלול, חלקת הקבר של אברהם סימון ז\"ל בהר הרצל (7) – אזור א', חלקה 11, שורה 9, קבר 1.​", "start": "נקודת התחלה: שכונת מלחה. רחוב פטריה – בין הרחובות חנוך קלעי וולוס נקודת סיום: חלקת הקבר בהר הרצל.", "length": "4.5 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/simon/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/simon.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1zTov5PZ_mzVzDL050C-EA23ntjM", "lat": 31.7544721, "lng": 35.1821118, "approx": false, "stops": [{"name": "מלחה (1) נקודת תצפית", "lat": 31.7544721, "lng": 35.1821118}, {"name": "המסגד שרידי  מלחה הערבית  (2)", "lat": 31.7543  בו עד מפגשו עם רחוב החבצלת. נעמוד לד תמונה באבן של עיתון \"החבצלת\" ושל ישראל דב פרומקיו (4) ברחוב החבצלת 2. נעלה צפונה ברחוב החבצלת עד \"כיכר אפרים די-זהב\" במפגש רחוב הנביאים. נמשיך מערבה ברחוב הנביאים כ-100 מטר עד רחוב אתיופיה. נפנה צפונה ברחוב אתיופיה לבית אליעזר בן-יהודה (5) ברחוב אתיופיה 11. נחזור לרחוב הנביאים ונלך 300 מטר מערבה עד רחוב ישעיהו. נפנה צפונה (ימינה) ונלך כ-200 מטר עד רחוב ישעיהו פרס, אל ביתו של ישראל דב פרומקין (6). כאן מסתיים המסלול.", "start": "נקודת התחלה: רחבת הכניסה לגן לאומי עיר דוד. נקודת סיום: בית ישראל דב פרומקין ברחוב ישעיהו פינת רחוב ישעיהו פרס.", "length": "3.5 ק\"מ", "difficulty": "בינוני", "accessible": "חלקי-הקפצה", "catalog": "https://tiulim.education.gov.il/trips-katalog/frumkin/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/fromkin.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1P2x8huLOe3PmRsbbCp_gi7eJVkc", "lat": 31.7743822, "lng": 35.2357601, "approx": false, "stops": [{"name": "תצפית גג בית הצופה בעיר דוד(2)", "lat": 31.7743822, "lng": 35.2357601}, {"name": "הכותל המערבי(1)", "lat": 31.7763528, "lng": 35.234144}, {"name": "חצר החבצלת (3) רח' הדגל (רח' אל ביראק )", "lat": 31.7789408, "lng": 35.2317864}, {"name": "עיתון החבצלת- תמונה באבן  (5) החבצלת 2", "lat": 31.7820136, "lng": 35.2200984}, {"name": "בית אליעזר בן יהודה(4)אתיופיה 11", "lat": 31.7850153, "lng": 35.2206634}, {"name": "ביתו של פרומקין (6) רח' ישעיהו פינת ישעיהו פרס", "lat": 31.7868184, "lng": 35.2178515}], "legs": [{"pts": [[31.7743822, 35.2357601], [31.7763528, 35.234144]], "dashed": true}, {"pts": [[31.77639, 35.23411], [31.77642, 35.23415], [31.77645, 35.2342], [31.77647, 35.23431], [31.77648, 35.2344], [31.77638, 35.23442], [31.77639, 35.23448], [31.77639, 35.23454], [31.7764, 35.2346], [31.77645, 35.23458], [31.77696, 35.23448], [31.77714, 35.23453], [31.77731, 35.2345], [31.77739, 35.23448], [31.77769, 35.23442], [31.77784, 35.23432], [31.778, 35.23428], [31.778, 35.23424], [31.77799, 35.23416], [31.77799, 35.23387], [31.77799, 35.2337 ל עקבותינו לרחוב המלך גורג', נלך דרומה (שמאלה) עד רחוב שמואל הנגיד, ובו נלך עד בית האמנים – מבנה \"בצלאל\" הישן (5) ברחוב שמואל הנגיד 12. נמשיך צפונה ברחוב שמואל הנגיד ונפנה לכיוון צפון-מערב (שמאלה) אל רחוב בצלאל. נלך עד בית שץ (6) ברחוב בצלאל 3. נמשיך ללכת ברחוב בצלאל עד לבניין ז'ראר בכר כדי לצפות ביצירה \"מסביב לעולם ב-92 יום\" (7) בבצלאל 11. ניכנס לנחלאות דרך רחוב הנציב, נפנה מזרחה (ימינה) ברחוב התבור וצפונה (שמאלה) לרחוב השומרון. בדרך כדאי לתור אחר ציורי גרפיטי המופיעים על עמודים ועל גגות הבתים. ברחוב אגריפס נלך לכיוון צפון-מערב (שמאלה) עד רחוב אליהו מני, אל ציור \"השוק\" (8) שבקרן הרחוב שמואל ברוך 9. ממש מול הציור, אפשר לראות את פניה של בת שבע, תושבת שכונת נחלאות, ה\"מודל\" שעל פיו צויר הגרפיטי אשר על דלתות המחסן. נשוב על עקבותינו ברחוב אגריפס לכיוון שוק מחנה יהודה (אפשר לראות גרפיטי נוספים ברחובות אילת וגזר). בהגיענו לרחוב מחנה יהודה, נפנה צפונה (שמאלה) אל תוך שוק מחנה יהודה (9), ובמעבר בו לכיוון רחוב יפו, נוכל להבחין בציורי גרפיטי רבים המעטרים את הקירות ובעיקר את התריסים ואת הדלתות של דוכני השוק. נפנה מזרחה (ימינה) ברחוב יפו אל ציור המתאר את הווי בית הספר \"אליאנס\" (10), ברחוב יפו 101. נמשיך במורד רחוב יפו, ומיד לאחר שנעבור את \"מרכז כלל\" נפנה ימינה. ליד דוכן פיס, סמוך ל\"שער אליאנס\", ברחוב יפו 97, נוכל לראות מקבץ יפה של ציורי גרפיטי (11). נמשיך ללכת ברחוב יפו עד למפגשו עם רחוב המלך ג'ורג'. מנקודה זו, אפשר לראות היטב את ציור הקיר \"תחבורה בירושלים\" (12), ברחוב יפו 54. נמשיך ברחוב יפו עד לרחוב שלומציון המלכה, נפנה לרחוב יוסף ריבלין וממנו לרחוב שמעון בן שטח. על קירות בניין הביטוח הלאומי, ברחוב שמעון בן שטח 4, נמצאים הציורים הצבעוניים (13). נלך עד סוף הרחוב ונפנה לכיוון צפון-מערב (שמאלה) ברחוב שלומציון המלכה ולכיוון מזרח (ימינה) ברחוב כורש. ברחוב כורש 10, כיכר קטנה שבה הציור \"גן עדן\" (14). נחזור על עקבותינו ונפנה לכיוון צפון-מזרח (ימינה) ברחוב עוזי חסון ומיד לכיוון דרום-מזרח (ימינה) לרחוב שושן, שלאורכו נעשה פרויקט גרפיטי עירוני (15). נצא דרך רחוב יוחנן מגוש חלב אל רחוב יפו, נחצה את הרחוב ונלך לכיוון צפון-מערב (שמאלה) עד הקיר ב\"כיכר ספרא\" שעליו מתנוססת מפת קלובר (16),ברחוב יפו מול בית מספר 21. כאן מסתיים המסלול. ​", "start": "נקודת התחלה: סמטת אדלר .9 נקודת סיום: \"כיכר ספרא\", בפינה המערבית ביותר של הכיכר, סמוך לרחוב יפו.", "length": "4 ק\"מ", "difficulty": "קל", "accessible": "נגיש ברובו", "catalog": "https://tiulim.education.gov.il/trips-katalog/boris/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/shz.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1cVvLnB1ix_U-GYo6mcqFLZLAY-Y", "lat": 31.7839922, "lng": 35.2224839, "approx": false, "stops": [{"name": "משכנו הראשון של בצלאל (1) סמטת  אדלר 7", "lat": 31.7839922, "lng": 35.2224839}, {"name": "דלתות בית חולים ביקור חולים(2) רח' שטראוס 6", "lat": 31.7838858, "lng": 35.2183864}, {"name": "אריחי קרמיקה(3) רחוב נתן שטראוס פינת יפו", "lat": 31.7832436, "lng": 35.2179276}, {"name": "ילדי ירושלים (4) רח' בן יהודה 21", "lat": 31.7813218, "lng": 35.2168672}, {"name": "בית האמנים - בצלאל הישן (5)רח' שמואל הנגיד 21", "lat": 31.7784447, "lng": 35.2149154}, {"name": "בית ש\"צ (6) רח' בצלאל 3", "lat": 31.7804051, "lng": 35.2142785999999}, {"name": "ציור סביב לעולם ב-92 יום(7) רח'בצלאל 11", "lat": 31.7809607, "lng": 35.2129557}, {"name": "ציור השוק (8) רח'  שמואל ברוך 9", "lat": 31.7850463, "lng": 35.2101595}, {"name": "ציור שוק מחנה יהודה(9) רח' מחנה יהודה פינת אליהו יעקב בנאי", "lat": 31.7849399, "lng": 35.2123555000001}, {"name": "ציור כל ישראל חברים(10) רח' יפו 110", "lat": 31.7857788, "lng": 35.2123770000001}, {"name": "אומנות גרפיטי(11) רח' יפו 97", "lat": 31.7843711, "lng": 35.2149868}, {"name": "ציור תחבורה בירושלים(12) רח'יפו 54", "lat": 31.7833323, "lng": 35.2176803}, {"name": "ציורי הקיר הצבעוניים(13) רח' שמעון בן שטח 4", "lat": 31.7797786, "lng": 35.2215128}, {"name": "ציור גן העדן (14) רח' כורש 10", "lat": 31.7794609, "lng": 35.2230784}, {"name": "פרוייקט גרפיטי עירוני(15) רח' שושן", "lat": 31.779373, "lng": 35.22374}, {"name": "מפת קלובר \"ירושלים מרכז העולם(16) כיכר ספרא רח' יפו", "lat": 31.7802063, "lng": 35.223265}], "legs": [{"pts": [[31.784, 35. מה המערבית של העיר העתיקה. כאשר החומה פונה מזרחה, נמשיך ישר דרומה ונראה משמאלנו את בניין הסמינר התאולוגי היווני-אורתודוכסי ולאחריו נראה את \"המכללה האמריקאית\". ניכנס דרך המכללה אל בית הקברות הנוצרי פרוטסטנטי בהר ציון (9), שם המסלול מסתיים.", "start": "נקודת התחלה: רחוב מאה שערים .78 נקודת סיום: בית הקברות הנוצרי-פרוטסטנטי בהר ציון.", "length": "7 ק\"מ", "difficulty": "קל", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/shik/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/shik.pdf", "gmap": "", "lat": 31.788, "lng": 35.222, "approx": true, "stops": [], "legs": [], "walk_km": null}, {"n": 58, "name": "בוני ירושלים - בעקבות עומר בן אל-ח'טאב", "topic": "בוני ירושלים", "title": "בעקבות עומר בן אל-ח'טאב", "story": "אל-קודס: הח'ליף עומר בן אל-ח'טאב כבש את ירושלים ב-638 והחזיר אליה את היהודים. מג'בל אל-מוכבר, דרך כנסיית הקבר ומסגד עומר ועד הר הבית.", "desc": "תחילת המסלול בנקודת תצפית בטיילת גולדמן – ג'בל אל-מוכאבר. ניכנס בכניסה הדרומית-מזרחית של הטיילת ברחוב על\"ר ונתקדם לאורכה אל אחת מרחבות התצפית לעבר העיר העתיקה והמרחב הסובב אותה. נצא מהטיילת, נפנה מערבה (ימינה) אל רחוב על\"ר, נחבור אל טיילת שרובר ונלך בה לשכונת אבו תור, לרחוב ישי. נלך בו צפונה ונרד במדרגות לרחוב עין רוגל, נפנה בו מערבה (שמאלה) אל רחוב דרך חברון, נלך צפונה ברחוב זה, נעבור את גיא בן הינום ואת ברכת הסולטן, נחצה את הצומת המרומזר מזרחה ונפנה צפונה (שמאלה) אל רחוב חטיבת ירושלים. נלך במקביל לחומות העיר, ברמזור הבא נפנה אל רחוב עומאר בן אל-ח'טאב ונלך בו אל שער יפו, באב אל-ח'ליל, שכניסתו רחבה הנקראת \"כיכר עומאר בן אל-ח'טאב. דרומית-מזרחית לכיכר נמצאת מצודת דוד. אפשר להיכנס למצודה בכניסה המערבית, הסמוכה לשער יפו, או בכניסה המזרחית, מרחוב הפטריארכיה הארמנית. נלך מזרחה ברחוב דוד דרך שווקי העיר העתיקה, נלך צפונה (שמאלה) ברחוב הנוצרים עד רחוב סנט הלנה, נפנה מזרחה (ימינה) אל כנסיית הקבר. דרומית לכנסייה עומד מסגד עומאר. נתקדם ברחוב סנט הלנה מזרחה ונפנה צפונה (שמאלה) ברחוב שוק הצבעים. הרחוב מתפתל מזרחה ודרומה, וממנו נעבור לרחוב שוק הבשמים. ברחוב דוד נפנה מזרחה (ימינה) וברחוב היהודים נפנה דרומה (ימינה) אל רחוב השלשלת ואל שער השלשלת שדרכו נכנסים למתחם הר הבית ולמסגדים. הנכנסים להר הבית דרך שער המוגרבים, לאחר תיאום עם המשטרה, צריכים לחזור ברחוב השלשלת מערבה ולפנות דרומה (שמאלה) ברחוב הכותל אל רחבת הכותל, לעלות בגשר העץ שמדרום לרחבת הכותל אל שער המוגרבים. במקום בכניסה להר הבית, אפשר להגיע לנקודת תצפית אל מתחם הר הבית ואל הכותל ברחוב משגב לדך שברובע היהודי. מסלול הסיור מסתיים בשער האשפות\n.", "start": "נקודת התחלה: תצפית מג'בל אל-מוכאבר, מטיילת גולדמן, נ\"צ (22262782610). נקודת סיום: שער האשפות, נ\"צ (22226783931).", "length": "5 ק\"מ", "difficulty": "בינוני", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/elhatab/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/omar.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1l76C49hMB0KXSyprtfUt04qBOGc", "lat": 31.7553905, "lng": 35.236664, "approx": false, "stops": [{"name": "ג'אבל מוכאבר -ארמון נציב (1) טיילת  גולדמן", "lat": 31.7553905, "lng": 35.236664}, {"name": "שכונת אבו תור (2) רח' ישי", "lat": 31.7648031, "lng": 35.2273554}, {"name": "כיכר עומר אבן אלחטאב -שער יפו(3)", "lat": 31.7766611, "lng": 35.2278341}, {"name": "כנסיית הקבר(4)", "lat": 31.7784448, "lng": 35.2295787}, {"name": "מסגד עומר (5) רח' סנט הלנה", "lat": 31.7778009, "lng": 35.2298528}, {"name": "שער השלשלת(6) רח' השלשלת", "lat": 31.7769197, "lng": 35.2332324}, {"name": "הר הבית והמסגדים(7)", "lat": 31.7777148, "lng": 35.2360356}, {"name": "שער האשפות", "lat": 31.7744306, "lng": 35.2339575}, {"name": "תצפית מתחם הר הבית והכותל", "lat": 31.7765718, "lng": 35.2328633}], "legs": [{"pts": [[31.75524, 35.23662], [31.75523, 35.23651], [31.75519, 35.2363], [31.75508, 35.23588], [31.75508, 35.23575], [31.75509, 35.23562], [31.75515, 35.23544], [31.75521, 35.23525], [31.75526, 35.23496], [31.75524, 35.23478], [31.75517, 35.23459], [31.75512, 35.23451], [31.75505, 35.23444], [31.7549, 35.2344], [31.75474, 35.23437], [31.75468, 35.23436], [31.75461, 35.23439], [31.75455, 35.23443], [31.75452, 35.2345 דוד עד סופו, נפנה דרומה (ימינה) ומיד מזרחה (שמאלה) ברחוב שער השלשלת. כמה מטרים אחרי הפנייה, נראה משמאל כתובת \"חאן א-סולטן\". ניכנס שמאלה למסדרון מקורה שמוביל לחצר פתוחה, זהו חאן אל-סולטן (7). מכאן נרד ברחוב עד שער השלשלת שבצדו הצפוני של הרחוב. סמוך לשער נמצא אל-מדרסה א-תנכזיה (8) וסמוך לו שער השלשלת (9). נחזור על עקבותינו, נפנה צפונה (שמאלה) לרחוב הגיא ונפנה מזרחה (ימינה) אל שוק הכותנה (10) ברחוב שוק עושי הכותנה (רחוב סוק אל-קטאנין). נחזור אל רחוב הגיא ונלך בו צפונה עד לרחוב מעלות המדרשה (עקבת א-תקיה). ברחוב מעלות המדרשה, נלך מערבה (שמאלה) לארמון סית טונשוק אל-מט'פריה (11). נחזור על עקבותינו אל רחוב הגיא ונלך בו צפונה (שמאלה) לרחוב ויה דולורוזה. נלך מזרחה (ימינה), שם הרחוב משתנה בהמשך לדרך שער האריות. נלך בו אל שער האריות (12). נעבור בשער ונתקדם מזרחה, ברחוב דרך יריחו, נפנה דרומה (ימינה) ונלך לאורכו עד קבר מוג'יר א-דין (13) הסמוך לכנסיית כל העמים ולקבר מרים אם ישו. כאן מסתיים המסלול.", "start": "נקודת התחלה: רחבת תצפית משכנות שאננים, רחוב יעקב שטיינהרדט. נקודת סיום: שער האשפות", "length": "4 ק\"מ", "difficulty": "קל", "accessible": "לא", "catalog": "https://tiulim.education.gov.il/trips-katalog/tankiz/", "pdf": "", "gmap": "https://www.google.com/maps/d/viewer?mid=1WG91Kqcf0BtYTL5JzoHdSfrSXAM", "lat": 31.7705314, "lng": 35.2245659, "approx": false, "stops": [{"name": "תצפית משכנות שאננים (1) רח' יעקב שטיינהרדט", "lat": 31.7705314, "lng": 35.2245659}, {"name": "שרידי אמת המים העליונה (2) שד' בלומפילד", "lat": 31.7715097, "lng": 35.2235574}, {"name": "שרידי האמה התחתונה (3)גן שרה משכנות שאננים", "lat": 31.7713535, "lng": 35.2251291}, {"name": "ברכת השולטאן והסביל(4) רחוב דרך חברון", "lat": 31.7712885, "lng": 35.2262181}, {"name": "שער יפו(5)", "lat": 31.7766109, "lng": 35.2276142000001}, {"name": "מצודת מגדל דוד(6)", "lat": 31.7763531, "lng": 35.228413}, {"name": "ח'אן א סולטאן (7) רח' שער השלשלת", "lat": 31.7768669, "lng": 35.2316769}, {"name": "מדרסת אל תנכיזה (8)ליד שער השלשלת", "lat": 31.7771806, "lng": 35.234093}, {"name": "שער השלשלת(8) רח' השלשלת(בסופו) ,", "l נים. נחזור אל רחוב פינסקר ונלך בו מזרחה אל רחוב יצחק אלחנן, ובו נלך צפונה (שמאלה) עד רחוב ז'בוטינסקי. נלך מזרחה (ימינה) ברחוב ז'בוטינסקי עד \"כיכר פלומר\", נחצה אותה מזרחה לשדרות בלומפילד. ברחוב ימין משה נרד במדרגות אל מרפסת גג במשכנות שאננים הצופה אל חומות העיר העתיקה, ליד טחנת הקמח של מונטיפיורי. נחזור אל המדרגות שברחוב ימין משה ונרד בהן לרחוב ש\"א נכון וממנו לרחוב דרך חברון. נפנה מזרחה (שמאלה) אל מרכז דרך חברון, שם נמצא הסביל של ברכת הסולטן. נחבור אל רחוב חטיבת ירושלים ונעלה בו צפונה (שמאלה). ברחוב עומאר אל-ח'טאב, נעלה צפונה לשער יפו. נעלה אל הציר הדרומי של טיילת החומות ונהלך על החומות מעל הרובע הנוצרי והמוסלמי ומעל שער שכם ונרד בשער האריות. כאן מסתיים המסלול.", "start": "נקודת התחלה: מוזאון האסלאם, רחוב הפלמ\"ח .5 נקודת סיום: שער האריות, רחוב דרך שער האריות.", "length": "5 ק\"מ", "difficulty": "קל", "accessible": "נגיש ברובו", "catalog": "https://tiulim.education.gov.il/trips-katalog/suliman/", "pdf": "https://meyda.education.gov.il/files/Tiyulim/soliman.pdf", "gmap": "https://www.google.com/maps/d/viewer?mid=1prYreyZOYo4Co_KfAwBqZTKR5uQ", "lat": 31.7684449, "lng": 35.2133562, "approx": false, "stops": [{"name": "המוזיאון לאומנות האיסלם (1) רח' הפלמ\"ח 2", "lat": 31.7684449, "lng": 35.2133562}, {"name": "וילה הארון אל ראשיד (2) רח' דוד מרכוס 18", "lat": 31.7685369, "lng": 35.2165599}, {"name": "בית ואסף בישאראח (3) רח' דוד מרכוס 16", "lat": 31.7692813, "lng": 35.2167811}, {"name": "וילה סלאמה (4) כיכר אורד וינגייט", "lat": 31.7712374, "lng": 35.2168935}, {"name": "בית ג'לאט (5) רח' בנימין ד'ישראלי 7 פינת אלקלעי", "lat": 31.7700254, "lng": 35.2181359}, {"name": "גן השושנים(6) בין הרחובות פינסקר  ודובנוב", "lat": 31.7685794, "lng": 35.2196038}, {"name": "תצפית חומות העיר העתיקה(7) גג משכנות שאננים ליד טחנת הקמח", "lat": 31.7715081, "lng": 35.2241549}, {"name": "סביל (רהט) בריכת הסולטאן (8) רח' דרך חברון", "lat": 31.7713022, "lng": 35.2262127}, {"name": "שער יפו ירושלים (9) רח' עומאר אל חטאב", "lat": 31.7766109, "lng": 35.2276142000001}, {"name": "שער האריות- (10)     <div class="actions">${link(t.pdf, "pdf", "תיק טיול")}${link(t.catalog, "info", "מינהלת הטיולים")}${link(t.gmap, "map", "מפת מסלול")}</div>
    ${t.start ? `<p class="section">נקודת התחלה</p><div class="prose">${esc(t.start)}</div>` : ""}
    ${t.stops.length > 1 ? `<p class="section">תחנות · ${t.stops.length}</p><ul class="group stoplist">${t.stops.map((s, i) =>
      `<li><span class="badge" style="border-color:${c}">${i + 1}</span><span class="cell-text"><b style="white-space:normal">${esc(s.name)}</b></span></li>`).join("")}</ul>` : ""}
    ${t.desc ? `<p class="section">תיאור המסלול</p><div class="prose">${esc(t.desc).replace(/\n/g, "<br>")}</div>` : ""}
    ${t.approx ? `<p class="footnote" style="margin:12px 16px">מיקום הנקודה משוער (נקודת ההתחלה).</p>` : ""}`;
  scroller.scrollTop = 0;
  $("back").onclick = listView;
}
listView();
if (isPhone()) map.panBy([0, visibleSheetHeight() / 2], {animate: false}); // keep the pins above the half-open sheet

/* ---------- full screen (Android / desktop) + iPhone home-screen tip ---------- */
const FS_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`;
const fsBtn = $("fs");
function syncFs() {
  const on = !!document.fullscreenElement;
  fsBtn.classList.toggle("on", on);
  fsBtn.innerHTML = on ? "✕ יציאה ממסך מלא" : FS_ICON;
  fsBtn.setAttribute("aria-label", on ? "יציאה ממסך מלא" : "מסך מלא");
}
if (document.fullscreenEnabled) {
  fsBtn.style.display = "flex"; syncFs();
  fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
  document.addEventListener("fullscreenchange", syncFs);
}
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
let tipSeen = false; try { tipSeen = localStorage.getItem("tipSeen") === "1"; } catch {}
if (isIOS && !standalone && !document.fullscreenEnabled && !tipSeen) {
  $("tip").style.display = "block";
  $("tip").querySelector("button").onclick = () => { $("tip").style.display = "none"; try { localStorage.setItem("tipSeen", "1"); } catch {} };
}

/* ---------- PWA: icon drawn on a canvas, manifest built as a Blob (keeps this a single file) ---------- */
function icon(size) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const g = c.getContext("2d"), r = size * .22;
  g.fillStyle = "#007AFF"; g.beginPath(); g.roundRect(0, 0, size, size, r); g.fill();
  g.fillStyle = "#fff"; g.font = `700 ${size * .46}px -apple-system,Segoe UI,Arial,sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("60", size / 2, size * .53);
  return c.toDataURL("image/png");
}
try {
  const i180 = icon(180), here = location.href.split("#")[0];
  const addLink = (rel, href, extra = {}) => { const l = document.createElement("link"); Object.assign(l, {rel, href}, extra); document.head.append(l); };
  addLink("apple-touch-icon", i180); addLink("icon", icon(64));
  const manifest = {name: "60 סיורים בירושלים", short_name: "60 סיורים", lang: "he", dir: "rtl",
    start_url: here, scope: new URL(".", here).href, display: "standalone", background_color: "#f2f2f7", theme_color: "#007aff",
    icons: [{src: icon(192), sizes: "192x192", type: "image/png"}, {src: icon(512), sizes: "512x512", type: "image/png", purpose: "any maskable"}]};
  addLink("manifest", URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"})));
} catch {}
